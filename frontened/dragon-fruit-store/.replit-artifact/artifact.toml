kind = "web"
previewPath = "/"
title = "Dragon Fruit Oasis"
version = "1.0.0"
id = "frontened/dragon-fruit-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18328

[services.development]
run = "pnpm --filter @workspace/dragon-fruit-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dragon-fruit-store", "run", "build" ]
publicDir = "frontened/dragon-fruit-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18328"
BASE_PATH = "/"
